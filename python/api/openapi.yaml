      required:
      - ativo_id
      - data_referencia
      - valor_compra
      - vida_util_meses
      - meses_decorridos
      - meses_efetivos
      - depreciacao_mensal
      - depreciacao_acumulada
      - valor_residual
      - percentual_depreciado
      title: DepreciacaoResponse
      description: 'Resposta de `GET /ativos/{id}/depreciacao` e bloco `depreciacao`
        do ativo (contrato §6.3).


        `meses_efetivos` e `depreciacao_mensal` expostos de propósito: cálculo auditável
        (AC-015).

        Valores monetários saem como string decimal, sem perda de precisão (contrato
        §6.3).'
      examples:
      - ativo_id: 12
        data_referencia: '2026-03-14'
        depreciacao_acumulada: '1200.00'
        depreciacao_mensal: '100.00'
        meses_decorridos: 12
        meses_efetivos: 12
        metodo: LINEAR
        percentual_depreciado: '20.00'
        valor_compra: '6000.00'
        valor_residual: '4800.00'
        vida_util_meses: 60
