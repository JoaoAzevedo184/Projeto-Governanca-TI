          title: Recomendacao Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomendacaoResponse'
        '400':
          description: Corpo da requisição ilegível (JSON ou multipart).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Sem token válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Perfil sem permissão (FR-015).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '409':
          description: Operação recusada por regra de negócio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '422':
          description: Payload malformado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
