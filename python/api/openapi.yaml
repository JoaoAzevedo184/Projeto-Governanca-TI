components:
  schemas:
    AtivoCreate:
      properties:
        nome:
          type: string
          maxLength: 120
          minLength: 3
          title: Nome
        tipo:
          $ref: '#/components/schemas/TipoAtivo'
        categoria_id:
          type: integer
          title: Categoria Id
        fornecedor_id:
          type: integer
          title: Fornecedor Id
        numero_serie:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Numero Serie
        chave_licenca:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Chave Licenca
        data_aquisicao:
          type: string
          format: date
          title: Data Aquisicao
        valor_compra:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Valor Compra
        vida_util_meses:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Vida Util Meses
        localizacao:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Localizacao
        observacoes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Observacoes
      type: object
      required:
      - nome
      - tipo
      - categoria_id
      - fornecedor_id
      - data_aquisicao
      - valor_compra
      title: AtivoCreate
    AtivoResponse:
      properties:
        id:
          type: integer
          title: Id
        nome:
