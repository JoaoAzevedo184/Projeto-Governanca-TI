name: observabilidade-governanca
services:
  python-api:
    build: ./python
    ports: ["8101:8080"]
  java-api:
    build: ./java
    ports: ["8102:8080"]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9092:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3002:3000"]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes: ["./infra/grafana:/etc/grafana/provisioning:ro"]
